<h2>Montar</h2>
<p class="lead">7 capítulos, na ordem. Cada passo mostra o que fazer, deixa você fazer na tela e confere antes de seguir. Depois é só repetir na bancada de verdade.</p>
<div class="mtcaps" id="mtCaps"></div>
<div class="mt">
  <aside class="mtlado">
    <details class="mtpassos" id="mtPassos"></details>
    <div class="card mtcard" id="mtCard"></div>
  </aside>
  <div class="mtarea">
    <div class="mtferr" id="mtFerr">
      <button class="btn ghost" id="mtVirar">Virar a placa</button>
      <button class="btn ghost" id="mtZoomMenos" aria-label="Diminuir">−</button>
      <button class="btn ghost" id="mtZoomMais" aria-label="Aumentar">+</button>
      <button class="btn ghost" id="mtCorrente">Ver corrente</button>
      <span class="muted">Roda do mouse aproxima · Shift + arrastar move</span>
    </div>
    <div class="mtquadro" id="mtQuadro"></div>
    <div class="card mtsim" id="mtSim" hidden></div>
  </div>
</div>
